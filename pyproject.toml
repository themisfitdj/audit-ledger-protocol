[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-ledger-protocol"
version = "0.2.0"
description = "Open methodology specification for evaluating AI-trading-agent recommendation ledgers — synthetic-vs-realized outcome computation, broker-truth reconciliation, KMS-signed manifest chain."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "themisfitdj"}]
keywords = ["audit", "ledger", "trading", "ai", "reconciliation", "manifest", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/themisfitdj/audit-ledger-protocol"
Reference-Adapter = "https://github.com/themisfitdj/brk-tasty"

[tool.setuptools.packages.find]
include = ["audit_ledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
